<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Choose Clothes · FitCheck</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page">
  <header class="topbar">
    <a class="logo" href="index.html">Fit<span>Check</span></a>
    <div class="steps" aria-label="Step 2 of 3"><i class="on"></i><i class="on"></i><i></i><span>2 / 3</span></div>
  </header>

  <h1>Pick something to try on</h1>
  <p class="lede">Tap an item to see which size fits you, and where.</p>

  <div class="card measure-chip" id="chip"></div>
  <section class="grid" id="grid" aria-label="Clothes"></section>
</main>

<script src="app.js"></script>
<script>
  const saved = Fit.loadBody();
  const body = saved || Fit.DEMO_BODY;
  const short = { height: 'Height', chest: 'Chest', waist: 'Waist', hip: 'Hips', inseam: 'Inseam', shoulder: 'Shoulders' };
  document.getElementById('chip').innerHTML =
    (saved ? '' : '<span>Demo body</span>') +
    Fit.FIELDS.map(f => `<span>${short[f.key]} <b>${Math.round(body[f.key])}</b></span>`).join('') +
    '<a href="index.html">Edit</a>';

  document.getElementById('grid').innerHTML = Fit.GARMENTS.map(g => `
    <a class="card garment" href="result.html?id=${encodeURIComponent(g.id)}">
      <div class="img" style="background:${g.bg}">${Fit.garmentArt(g)}</div>
      <div class="meta">
        <div class="brand">${g.brand}</div>
        <div class="name">${g.name}</div>
      </div>
    </a>`).join('');
</script>
</body>
</html>
